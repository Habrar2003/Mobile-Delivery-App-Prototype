      document.addEventListener('DOMContentLoaded', function () {
        var signInButton = document.getElementById('u17');
        var usernameInput = document.getElementById('u30_input');
        var passwordInput = document.getElementById('u22_input');
        var errorMessage = document.getElementById('u18');

        if (!signInButton || !usernameInput || !passwordInput || !errorMessage) {
          return;
        }

        signInButton.addEventListener('click', function () {
          var isDemoAccount =
            usernameInput.value.trim().toLowerCase() === 'demo' &&
            passwordInput.value === '123';

          if (isDemoAccount) {
            window.location.href = 'main_menu.html';
            return;
          }

          errorMessage.style.display = 'block';
          errorMessage.style.visibility = 'visible';
        });
      });
